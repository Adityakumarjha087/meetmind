[project]
name = "meetmind-backend"
version = "0.1.0"
description = "MeetMind API: meeting transcription, diarization, summarisation and action-item tracking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.2",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "python-socketio>=5.11",
    "boto3>=1.35",
    "httpx2>=2.16",
    "structlog>=24.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "numpy>=2.0",
    "fpdf2>=2.7.9",
    "anthropic>=2.14",
    "openai>=3.59",
]

[project.optional-dependencies]
# Heavy, model-downloading backends. Not installed in CI; opt in with `uv sync --extra ml`.
ml = [
    "faster-whisper>=1.0.3",
    "pyannote.audio>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "moto[s3]>=5.0",
    "fakeredis>=2.24",
    "types-redis",
    "boto3-stubs[s3]",
    "celery-types",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["E501", "PLR0917", "N818", "PLC0415", "PLW0603", "PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["app.realtime"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["pgvector.*", "fpdf.*", "socketio.*", "faster_whisper.*", "pyannote.*", "moto.*", "fakeredis.*", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/stt/faster_whisper_backend.py", "app/stt/pyannote_backend.py", "app/worker.py"]

[tool.coverage.report]
show_missing = false
skip_covered = true
